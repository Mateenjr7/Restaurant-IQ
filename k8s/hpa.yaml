apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: restaurantiq
  namespace: restaurantiq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: restaurantiq
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
